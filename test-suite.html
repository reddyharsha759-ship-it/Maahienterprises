<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MAAHI PRODUCTS — Interactive Feature Test Suite</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-dark: #0b0f19;
      --bg-card: #161e31;
      --border-color: #243049;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --accent: #3b82f6;
      --success: #10b981;
      --failure: #ef4444;
      --warning: #f59e0b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Left Sidebar: Test Control Panel */
    .control-panel {
      width: 420px;
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      height: 100%;
      background-color: #0e1322;
      z-index: 10;
    }

    .panel-header {
      padding: 1.5rem;
      border-bottom: 1px solid var(--border-color);
    }

    .panel-header h1 {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .panel-header h1 span {
      color: var(--accent);
    }

    .panel-header p {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 0.25rem;
    }

    /* Progress Stats */
    .stats-bar {
      padding: 1rem 1.5rem;
      background-color: #11182c;
      border-bottom: 1px solid var(--border-color);
    }

    .progress-track {
      width: 100%;
      height: 6px;
      background-color: var(--border-color);
      border-radius: 9999px;
      overflow: hidden;
      margin-bottom: 0.75rem;
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--success));
      transition: width 0.3s ease;
    }

    .stats-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      font-weight: 500;
    }

    .stat-pill {
      display: flex;
      align-items: center;
      gap: 0.25rem;
    }

    .stat-pill.passed { color: var(--success); }
    .stat-pill.failed { color: var(--failure); }
    .stat-pill.total { color: var(--text-muted); }

    /* Test Cases List */
    .tests-list {
      flex: 1;
      overflow-y: auto;
      padding: 1rem 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .test-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 1rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .test-card:hover {
      border-color: #3b82f6aa;
    }

    .test-card.active {
      border-color: var(--accent);
      box-shadow: 0 0 12px rgba(59, 130, 246, 0.15);
    }

    .test-card.passed {
      border-color: #10b98144;
    }

    .test-card.failed {
      border-color: #ef444444;
    }

    .test-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.5rem;
    }

    .test-name {
      font-size: 0.95rem;
      font-weight: 600;
    }

    .test-status {
      font-size: 0.75rem;
      padding: 0.15rem 0.5rem;
      border-radius: 9999px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .test-status.pending { background-color: #374151; color: var(--text-muted); }
    .test-status.running { background-color: #1e3a8a; color: #93c5fd; animation: pulse 1.5s infinite; }
    .test-status.passed { background-color: #064e3b; color: #6ee7b7; }
    .test-status.failed { background-color: #7f1d1d; color: #fca5a5; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }

    .test-desc {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }

    .test-logs {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      background-color: #0b0f19;
      border-radius: 4px;
      padding: 0.5rem;
      max-height: 120px;
      overflow-y: auto;
      display: none;
      border: 1px solid #1f2937;
    }

    .test-card.active .test-logs {
      display: block;
    }

    .log-entry {
      margin-bottom: 0.25rem;
      line-height: 1.4;
    }

    .log-entry.info { color: var(--text-muted); }
    .log-entry.step { color: var(--accent); }
    .log-entry.success { color: var(--success); }
    .log-entry.error { color: var(--failure); font-weight: bold; }

    /* Footer / Controls */
    .panel-footer {
      padding: 1.5rem;
      border-top: 1px solid var(--border-color);
      display: flex;
      gap: 0.75rem;
    }

    .btn {
      flex: 1;
      padding: 0.75rem;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      border: none;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .btn-primary {
      background-color: var(--accent);
      color: white;
    }

    .btn-primary:hover {
      background-color: #2563eb;
    }

    .btn-primary:disabled {
      background-color: #1d4ed855;
      color: var(--text-muted);
      cursor: not-allowed;
    }

    .btn-secondary {
      background-color: #1f2937;
      color: var(--text-main);
      border: 1px solid var(--border-color);
    }

    .btn-secondary:hover {
      background-color: #374151;
    }

    /* Right Section: Viewport Iframe Container */
    .viewport-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
      background-color: #121824;
    }

    .viewport-header {
      height: 60px;
      border-bottom: 1px solid var(--border-color);
      padding: 0 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .viewport-title {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .viewport-title span {
      background-color: var(--border-color);
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      font-family: monospace;
      color: var(--text-main);
      font-size: 0.8rem;
    }

    .viewport-controls {
      display: flex;
      gap: 0.5rem;
    }

    .viewport-btn {
      background: none;
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 0.35rem 0.75rem;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
    }

    .viewport-btn.active {
      background-color: var(--border-color);
      color: var(--text-main);
    }

    .iframe-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      overflow: hidden;
    }

    #app-frame {
      width: 100%;
      height: 100%;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      background-color: white;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Viewport Resizes */
    .viewport-desktop #app-frame { width: 100%; height: 100%; }
    .viewport-tablet #app-frame { width: 768px; height: 100%; }
    .viewport-mobile #app-frame { width: 375px; height: 100%; }

    /* Modal dialog */
    .modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(4px);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .modal.open {
      opacity: 1;
      pointer-events: auto;
    }
    .modal-content {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 2rem;
      max-width: 480px;
      width: 90%;
      box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5);
      text-align: center;
    }
    .modal-content h3 {
      font-size: 1.5rem;
      margin-bottom: 0.75rem;
    }
    .modal-content p {
      color: var(--text-muted);
      margin-bottom: 1.5rem;
      font-size: 0.95rem;
      line-height: 1.5;
    }
    .modal-buttons {
      display: flex;
      gap: 1rem;
    }
  </style>
</head>
<body>

  <!-- Test Panel -->
  <div class="control-panel">
    <div class="panel-header">
      <h1>MAAHI<span> PRODUCTS</span> Feature Tests</h1>
      <p>Automated functional test suite for storefront & dashboard</p>
    </div>

    <div class="stats-bar">
      <div class="progress-track">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
      <div class="stats-row">
        <div class="stat-pill total">Total: <span id="stat-total">0</span></div>
        <div class="stat-pill passed">Passed: <span id="stat-passed">0</span></div>
        <div class="stat-pill failed">Failed: <span id="stat-failed">0</span></div>
      </div>
    </div>

    <!-- Scrollable list of tests -->
    <div class="tests-list" id="tests-list"></div>

    <div class="panel-footer">
      <button class="btn btn-primary" id="btn-run-tests">Run All Tests</button>
      <button class="btn btn-secondary" id="btn-reset">Reset</button>
    </div>
  </div>

  <!-- App Iframe Viewer -->
  <div class="viewport-panel viewport-desktop" id="viewport-panel">
    <div class="viewport-header">
      <div class="viewport-title">
        Live App Viewport: <span id="iframe-url">index.html</span>
      </div>
      <div class="viewport-controls">
        <button class="viewport-btn active" data-vp="desktop">Desktop</button>
        <button class="viewport-btn" data-vp="tablet">Tablet</button>
        <button class="viewport-btn" data-vp="mobile">Mobile</button>
      </div>
    </div>
    <div class="iframe-wrapper">
      <iframe id="app-frame" src="index.html" title="App Runner"></iframe>
    </div>
  </div>

  <!-- Finished Modal -->
  <div class="modal" id="finish-modal">
    <div class="modal-content">
      <h3 id="modal-title">Tests Finished</h3>
      <p id="modal-body">Tests have completed successfully.</p>
      <div class="modal-buttons">
        <button class="btn btn-primary" onclick="closeModal()">Close</button>
      </div>
    </div>
  </div>

  <script>
    const iframe = document.getElementById('app-frame');
    
    // Intercept console logs to display inside our test logs for debugging
    const originalConsoleLog = console.log;
    const originalConsoleError = console.error;
    const originalConsoleWarn = console.warn;

    function addConsoleLog(msg, type = 'info') {
      if (currentTestIndex >= 0 && currentTestIndex < testQueue.length) {
        log(testQueue[currentTestIndex], `[Console] ${msg}`, type);
      } else {
        originalConsoleLog(msg);
      }
    }

    console.log = function(...args) {
      originalConsoleLog.apply(console, args);
      addConsoleLog(args.join(' '), 'info');
    };
    console.error = function(...args) {
      originalConsoleError.apply(console, args);
      addConsoleLog(args.join(' '), 'error');
    };
    console.warn = function(...args) {
      originalConsoleWarn.apply(console, args);
      addConsoleLog(args.join(' '), 'warning');
    };

    // Hook iframe console on load
    iframe.addEventListener('load', () => {
      try {
        const win = iframe.contentWindow;
        win.console.log = function(...args) {
          addConsoleLog(`(Iframe) ${args.join(' ')}`, 'info');
        };
        win.console.error = function(...args) {
          addConsoleLog(`(Iframe) ${args.join(' ')}`, 'error');
        };
        win.console.warn = function(...args) {
          addConsoleLog(`(Iframe) ${args.join(' ')}`, 'warning');
        };
      } catch (e) {}
    });

    const iframeUrlLabel = document.getElementById('iframe-url');
    const progressFill = document.getElementById('progress-fill');
    const statTotalLabel = document.getElementById('stat-total');
    const statPassedLabel = document.getElementById('stat-passed');
    const statFailedLabel = document.getElementById('stat-failed');
    const testsListContainer = document.getElementById('tests-list');
    const btnRunTests = document.getElementById('btn-run-tests');
    const btnReset = document.getElementById('btn-reset');
    const finishModal = document.getElementById('finish-modal');

    // Update iframe url label
    iframe.addEventListener('load', () => {
      try {
        const path = iframe.contentWindow.location.pathname;
        const page = path.substring(path.lastIndexOf('/') + 1) || 'index.html';
        iframeUrlLabel.textContent = page;
      } catch(e) {
        iframeUrlLabel.textContent = "External/Cross-Origin";
      }
    });

    // Viewport switcher
    document.querySelectorAll('.viewport-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('.viewport-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        const mode = e.target.getAttribute('data-vp');
        const panel = document.getElementById('viewport-panel');
        panel.className = 'viewport-panel viewport-' + mode;
      });
    });

    function showModal(title, body) {
      document.getElementById('modal-title').textContent = title;
      document.getElementById('modal-body').textContent = body;
      finishModal.classList.add('open');
    }

    function closeModal() {
      finishModal.classList.remove('open');
    }

    // Testing variables
    let testQueue = [];
    let currentTestIndex = -1;
    let passedCount = 0;
    let failedCount = 0;

    // Helper functions for assertions and delays
    const delay = (ms) => new Promise(resolve => setTimeout(resolve, ms));
    
    function log(testObj, message, type = 'info') {
      const logsEl = document.getElementById(`logs-${testObj.id}`);
      const entry = document.createElement('div');
      entry.className = `log-entry ${type}`;
      entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
      logsEl.appendChild(entry);
      logsEl.scrollTop = logsEl.scrollHeight;
    }

    function assert(testObj, condition, successMessage, errorMessage) {
      if (condition) {
        log(testObj, `✔ Passed: ${successMessage}`, 'success');
        return true;
      } else {
        log(testObj, `✘ Failed: ${errorMessage}`, 'error');
        throw new Error(errorMessage);
      }
    }

    // Register a Test Case
    function registerTest(name, description, fn) {
      const id = 'test_' + testQueue.length;
      const testObj = { id, name, description, fn, status: 'pending', logs: [] };
      testQueue.push(testObj);
      renderTestCard(testObj);
    }

    function renderTestCard(testObj) {
      const card = document.createElement('div');
      card.className = 'test-card';
      card.id = `card-${testObj.id}`;
      card.innerHTML = `
        <div class="test-meta">
          <div class="test-name">${testObj.name}</div>
          <span class="test-status pending" id="status-${testObj.id}">pending</span>
        </div>
        <div class="test-desc">${testObj.description}</div>
        <div class="test-logs" id="logs-${testObj.id}"></div>
      `;
      card.addEventListener('click', () => {
        document.querySelectorAll('.test-card').forEach(c => c.classList.remove('active'));
        card.classList.add('active');
      });
      testsListContainer.appendChild(card);
    }

    function updateCardStatus(testObj, status) {
      testObj.status = status;
      const statusEl = document.getElementById(`status-${testObj.id}`);
      const cardEl = document.getElementById(`card-${testObj.id}`);
      
      statusEl.textContent = status;
      statusEl.className = `test-status ${status}`;
      
      cardEl.className = `test-card ${status}`;
      if (status === 'running') {
        cardEl.classList.add('active');
      }
    }

    function updateStats() {
      statTotalLabel.textContent = testQueue.length;
      statPassedLabel.textContent = passedCount;
      statFailedLabel.textContent = failedCount;
      
      const completed = passedCount + failedCount;
      const pct = testQueue.length > 0 ? (completed / testQueue.length) * 100 : 0;
      progressFill.style.width = `${pct}%`;
    }

    async function runNextTest() {
      currentTestIndex++;
      if (currentTestIndex >= testQueue.length) {
        // Complete
        btnRunTests.disabled = false;
        const total = testQueue.length;

        // Compile and send test results to the local server
        const results = {
          passed: passedCount,
          failed: failedCount,
          logs: []
        };
        testQueue.forEach(testObj => {
          results.logs.push(`--- Test: ${testObj.name} (${testObj.status.toUpperCase()}) ---`);
          const logsEl = document.getElementById(`logs-${testObj.id}`);
          Array.from(logsEl.children).forEach(entry => {
            results.logs.push(entry.textContent);
          });
          results.logs.push(''); // spacing
        });

        fetch('/api/test-results', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(results)
        }).catch(e => console.error("Failed to submit results:", e));

        if (failedCount === 0) {
          showModal("All Tests Passed! 🎉", `Successfully ran and verified all ${passedCount} features of the MAAHI PRODUCTS storefront and dashboard. Everything is working correctly!`);
        } else {
          showModal("Tests Complete (With Failures) ⚠️", `Completed running the test suite. Passed: ${passedCount}, Failed: ${failedCount}. Please check the logs in the left panel for error details.`);
        }
        return;
      }

      const testObj = testQueue[currentTestIndex];
      updateCardStatus(testObj, 'running');
      log(testObj, `Starting test: ${testObj.name}`, 'step');

      try {
        await testObj.fn(testObj);
        passedCount++;
        updateCardStatus(testObj, 'passed');
        log(testObj, `Test completed successfully!`, 'success');
      } catch (err) {
        failedCount++;
        updateCardStatus(testObj, 'failed');
        log(testObj, `Test failed: ${err.message}`, 'error');
      }

      updateStats();
      await delay(1000); // Small cooldown between tests
      runNextTest();
    }

    function resetSuite() {
      passedCount = 0;
      failedCount = 0;
      currentTestIndex = -1;
      updateStats();
      
      testQueue.forEach(testObj => {
        updateCardStatus(testObj, 'pending');
        const logsEl = document.getElementById(`logs-${testObj.id}`);
        logsEl.innerHTML = '';
      });

      iframe.src = 'index.html';
    }

    // TEST DEFINITIONS

    // 1. Storefront Load Test
    registerTest(
      "1. Storefront Loading",
      "Verify the index.html page loads and renders core components and products catalog.",
      async (t) => {
        // Enforce local storage mode and clean slate for testing
        localStorage.setItem('maahi_test_mode', 'true');
        localStorage.removeItem('glc_cart_v1');
        localStorage.removeItem('maahi_consumer_profile');
        localStorage.removeItem('maahi_owner_auth_token');
        localStorage.removeItem('maahi_user_profile');
        localStorage.removeItem('glc_orders_v1');
        localStorage.removeItem('maahi_catalog_v1');
        localStorage.removeItem('glc_catalog_v1');

        iframe.src = 'index.html';
        try {
          iframe.contentWindow.addEventListener('error', function(e) {
            log(t, `[Iframe Error] ${e.message} at ${e.filename}:${e.lineno}:${e.colno}`, 'error');
          });
        } catch(err) {}
        log(t, "Navigating to index.html...");
        await delay(1500); // Initial wait
        let retries = 15;
        while (retries > 0 && (!iframe.contentWindow.maahiSupabase || !iframe.contentWindow.maahiInitialized)) {
          await delay(200);
          retries--;
        }

        const doc = iframe.contentDocument || iframe.contentWindow.document;
        
        // Assertions
        const logo = doc.querySelector('.logo');
        assert(t, logo !== null, "Logo element found.", "Logo element not found.");
        assert(t, logo.textContent.includes("MAAHI"), "Logo text contains 'MAAHI'.", "Logo text doesn't contain 'MAAHI'.");

        const products = doc.querySelectorAll('.product-card');
        assert(t, products.length === 4, "Found exactly 4 product cards in catalog.", `Expected 4 product cards, but found ${products.length}.`);

        const cartBtn = doc.getElementById('cart-open-btn');
        assert(t, cartBtn !== null, "Cart trigger button found.", "Cart trigger button not found.");
      }
    );

    // 2. Product Search Test
    registerTest(
      "2. Product Search & Filter",
      "Verify typing a search query filters the catalog products dynamically.",
      async (t) => {
        const doc = iframe.contentDocument || iframe.contentWindow.document;
        const searchInput = doc.getElementById('product-search');
        assert(t, searchInput !== null, "Search input found in header.", "Search input not found.");

        log(t, "Typing '650g' into search...");
        searchInput.value = "650g";
        searchInput.dispatchEvent(new Event('input', { bubbles: true }));
        searchInput.dispatchEvent(new Event('change', { bubbles: true }));
        await delay(800);

        const visibleProducts = Array.from(doc.querySelectorAll('.product-card')).filter(card => !card.classList.contains('product-hidden'));
        assert(t, visibleProducts.length === 1, "Only 1 product visible after filtering '650g'.", `Expected 1 visible product, but found ${visibleProducts.length}.`);
        
        const title = visibleProducts[0].querySelector('h3').textContent;
        assert(t, title.includes("650 g"), `Found product is '650 g cocopeat blocks'.`, `Found unexpected product title: ${title}`);

        log(t, "Clearing search field...");
        searchInput.value = "";
        searchInput.dispatchEvent(new Event('input', { bubbles: true }));
        searchInput.dispatchEvent(new Event('change', { bubbles: true }));
        await delay(800);

        const allProducts = Array.from(doc.querySelectorAll('.product-card')).filter(card => !card.classList.contains('product-hidden'));
        assert(t, allProducts.length === 4, "All 4 products visible after clearing search.", `Expected 4 products, found ${allProducts.length}.`);
      }
    );

    // 3. Customer Login Simulation Test
    registerTest(
      "3. Customer Sign In (OAuth Simulation)",
      "Verify login flow using simulated Google Accounts selection.",
      async (t) => {
        const doc = iframe.contentDocument || iframe.contentWindow.document;
        
        log(t, "Clicking 'Sign In' header button...");
        doc.getElementById('profile-open-btn').click();
        await delay(1500); // Initial wait
        let retries3 = 15;
        while (retries3 > 0 && (!iframe.contentWindow.maahiLoginInitialized)) {
          await delay(200);
          retries3--;
        }

        // Clicking profile-open-btn redirects directly to login.html if guest
        const loginDoc = iframe.contentDocument || iframe.contentWindow.document;
        assert(t, loginDoc.title.includes("Sign In"), "Redirected to login.html page.", "Did not redirect to login.html.");

        // Force OAuth simulation for test purposes
        if (loginDoc.defaultView.MAAHI_CONFIG) {
          loginDoc.defaultView.MAAHI_CONFIG.useRealGoogleOAuth = false;
        }
        iframe.contentWindow.localStorage.setItem("maahi_use_real_google_oauth", "false");

        // Click Google Sign-In button
        const googleBtn = loginDoc.getElementById('btn-google-login');
        assert(t, googleBtn !== null, "Google Login button found.", "Google Login button not found.");
        
        log(t, "Triggering Simulated Google Login...");
        googleBtn.click();
        await delay(800);

        // Verify simulated modal opens
        const modal = loginDoc.getElementById('google-oauth-modal');
        assert(t, modal && loginDoc.defaultView.getComputedStyle(modal).opacity === '1', "Simulated Google OAuth Modal is open.", "OAuth Modal is not open.");

        // Select first customer account row
        const accountRow = loginDoc.querySelector('.google-account-row');
        assert(t, accountRow !== null, "Found mock accounts in modal list.", "No mock accounts found.");
        const customerEmail = accountRow.getAttribute('data-email');
        log(t, `Selecting mock account: ${customerEmail}`);
        
        accountRow.click();
        await delay(2000); // Initial wait
        let retries = 15;
        while (retries > 0 && (!iframe.contentWindow.maahiSupabase || !iframe.contentWindow.document.getElementById('profile-btn-label'))) {
          await delay(200);
          retries--;
        }

        // We should be back on index.html, signed in
        const homeDoc = iframe.contentDocument || iframe.contentWindow.document;
        assert(t, homeDoc.getElementById('profile-open-btn') !== null, "Back to storefront index.html.", "Not redirected back to storefront.");

        log(t, `Debug - maahi_test_mode: ${iframe.contentWindow.localStorage.getItem('maahi_test_mode')}`);
        log(t, `Debug - maahi_consumer_profile: ${iframe.contentWindow.localStorage.getItem('maahi_consumer_profile')}`);
        log(t, `Debug - maahiSupabase type: ${typeof iframe.contentWindow.maahiSupabase}`);
        log(t, `Debug - maahiSupabase keys: ${iframe.contentWindow.maahiSupabase ? Object.keys(iframe.contentWindow.maahiSupabase).join(', ') : 'none'}`);
        log(t, `Debug - isConnected: ${iframe.contentWindow.maahiSupabase && iframe.contentWindow.maahiSupabase.isConnected ? iframe.contentWindow.maahiSupabase.isConnected() : 'undefined'}`);

        const profileBtnLabel = homeDoc.getElementById('profile-btn-label').textContent;
        assert(t, profileBtnLabel !== "Sign In", `Sign-in successful! Profile button shows: '${profileBtnLabel}'`, `Profile label still shows 'Sign In'.`);
      }
    );

    // 4. Cart Operations
    registerTest(
      "4. Cart Operations",
      "Verify adding items to cart, opening cart drawer, and checking subtotal.",
      async (t) => {
        const doc = iframe.contentDocument || iframe.contentWindow.document;
        
        log(t, "Adding 2 x '5 kg cocopeat blocks' to cart (Price: ₹220)...");
        const qty5kg = doc.getElementById('qty-5kg');
        assert(t, qty5kg !== null, "Found 5kg block quantity input.", "5kg block quantity input not found.");
        qty5kg.value = 2;
        qty5kg.dispatchEvent(new Event('change'));
        doc.querySelector('[data-add="5kg"]').click();
        await delay(500);

        log(t, "Adding 1 x 'Grow bags' to cart (Price: ₹175)...");
        const qtyGrow = doc.getElementById('qty-growbags');
        assert(t, qtyGrow !== null, "Found Grow bags quantity input.", "Grow bags quantity input not found.");
        qtyGrow.value = 1;
        qtyGrow.dispatchEvent(new Event('change'));
        doc.querySelector('[data-add="growbags"]').click();
        await delay(500);

        // Verify badge count
        const badge = doc.getElementById('cart-badge');
        assert(t, badge.textContent === "3", "Cart badge count is '3'.", `Expected badge count to be '3', got '${badge.textContent}'.`);

        log(t, "Opening cart drawer...");
        doc.getElementById('cart-open-btn').click();
        await delay(800);

        const drawer = doc.getElementById('cart-drawer');
        assert(t, drawer.classList.contains('is-open') || drawer.getAttribute('aria-hidden') === 'false', "Cart drawer is open.", "Cart drawer did not open.");

        // Check subtotal in drawer (2 * 220 + 1 * 175 = 615)
        const subtotalText = doc.getElementById('cart-drawer-subtotal').textContent;
        assert(t, subtotalText.includes("615"), `Cart subtotal correctly displays ₹615 (Actual: ${subtotalText})`, `Incorrect subtotal displayed. Got: ${subtotalText}`);
      }
    );

    // 5. Cart Edit & Delete Test
    registerTest(
      "5. Edit & Remove Cart Items",
      "Verify altering quantities and removing items in the cart drawer updates the subtotal.",
      async (t) => {
        const doc = iframe.contentDocument || iframe.contentWindow.document;

        log(t, "Increasing 'Grow bags' quantity to 2 in cart...");
        const rowGrow = Array.from(doc.querySelectorAll('.cart-line')).find(row => row.querySelector('.cart-line-title').textContent.includes("Grow bags"));
        assert(t, rowGrow !== undefined, "Grow bags found in cart drawer.", "Grow bags not found in cart.");
        
        const qtyInput = rowGrow.querySelector('input[type="number"]');
        qtyInput.value = 2;
        qtyInput.dispatchEvent(new Event('change', { bubbles: true }));
        await delay(600);

        // New subtotal should be: 2 * 220 + 2 * 175 = 440 + 350 = 790
        const subtotalText = doc.getElementById('cart-drawer-subtotal').textContent;
        assert(t, subtotalText.includes("790"), `Subtotal updated to ₹790 after changing quantity (Actual: ${subtotalText})`, `Subtotal did not update to 790. Got: ${subtotalText}`);

        log(t, "Removing '5 kg cocopeat blocks' from cart...");
        const row5kg = Array.from(doc.querySelectorAll('.cart-line')).find(row => row.querySelector('.cart-line-title').textContent.includes("5 kg"));
        row5kg.querySelector('[data-remove]').click();
        await delay(800);

        // Badge should update to 2
        const badge = doc.getElementById('cart-badge');
        assert(t, badge.textContent === "2", "Cart badge count updated to '2'.", `Expected badge count '2', got '${badge.textContent}'.`);

        // Subtotal should update to 2 * 175 = 350
        const finalSubtotal = doc.getElementById('cart-drawer-subtotal').textContent;
        assert(t, finalSubtotal.includes("350"), `Subtotal updated to ₹350 after removal (Actual: ${finalSubtotal})`, `Subtotal incorrect. Got: ${finalSubtotal}`);
        
        // Close drawer
        doc.getElementById('cart-close-btn').click();
        await delay(500);
      }
    );

    // 6. Storefront Checkout Flow Test
    registerTest(
      "6. Customer Checkout Flow",
      "Verify cart checkout process with prefilled consumer details.",
      async (t) => {
        const doc = iframe.contentDocument || iframe.contentWindow.document;
        
        log(t, "Navigating to Checkout section...");
        doc.querySelector('a[href="#order"]').click();
        await delay(800);

        // Check if customer name and email are pre-filled in checkout form
        const checkoutName = doc.getElementById('order-name');
        const checkoutEmail = doc.getElementById('order-email');

        assert(t, checkoutName.value !== "", `Name input prefilled: '${checkoutName.value}'`, "Name input was empty.");
        assert(t, checkoutEmail.value !== "", `Email input prefilled: '${checkoutEmail.value}'`, "Email input was empty.");

        // Fill remaining required shipping info
        log(t, "Filling in shipping address...");
        
        // Select delivery option
        const deliverySelect = doc.getElementById('order-delivery');
        deliverySelect.value = 'ship';
        deliverySelect.dispatchEvent(new Event('change'));

        // Target date (tomorrow)
        const tomorrow = new Date();
        tomorrow.setDate(tomorrow.getDate() + 1);
        const dateStr = tomorrow.toISOString().slice(0, 10);
        doc.getElementById('order-date').value = dateStr;

        doc.getElementById('order-phone').value = "9876543210";
        doc.getElementById('order-region').value = "Coimbatore, Tamil Nadu";
        doc.getElementById('order-address').value = "45, Green Farms Road, Organic Colony";
        await delay(300);

        // Mock Razorpay SDK in the iframe unconditionally (replaces real script if loaded)
        log(t, "Mocking Razorpay payment gateway...");
        iframe.contentWindow.Razorpay = function(options) {
          this.open = function() {
            log(t, "Simulating successful Razorpay payment callback...");
            if (options.handler) {
              options.handler({
                razorpay_payment_id: "pay_mock_" + Math.random().toString(36).substring(2)
              });
            }
          };
        };

        log(t, "Submitting order...");
        doc.getElementById('place-order-btn').click();
        await delay(2000);

        // Verify successful placement
        const badge = doc.getElementById('cart-badge');
        assert(t, badge.hidden || badge.textContent === "0", "Order placed successfully! Checkout cart cleared.", "Order was not completed.");
      }
    );

    // 7. Admin/Owner Login & Dashboard Test
    registerTest(
      "7. Owner Login & Dashboard",
      "Verify admin/owner authentication and dashboard metric charts and tables rendering.",
      async (t) => {
        log(t, "Navigating to owner dashboard login...");
        iframe.src = 'owner/login.html';
        try {
          iframe.contentWindow.addEventListener('error', function(e) {
            log(t, `[Iframe Error] ${e.message} at ${e.filename}:${e.lineno}:${e.colno}`, 'error');
          });
        } catch(err) {}
        await delay(1500); // Initial wait
        let loginRetries = 15;
        while (loginRetries > 0 && (!iframe.contentWindow.maahiLoginInitialized)) {
          await delay(200);
          loginRetries--;
        }

        const loginDoc = iframe.contentDocument || iframe.contentWindow.document;
        assert(t, loginDoc.title.includes("Sign In"), "Redirected to unified Sign In page.", "Failed redirect to login page.");

        // Verify Admin role is active
        const roleBtn = loginDoc.getElementById('role-btn-admin');
        assert(t, roleBtn.classList.contains('active'), "Admin/Owner login mode is active.", "Admin mode is not active.");

        // Fill admin credentials restored in config.js
        log(t, "Entering admin credentials: admin@maahiproducts.com...");
        loginDoc.getElementById('admin-email').value = "admin@maahiproducts.com";
        loginDoc.getElementById('admin-password').value = "maahi2026";
        
        log(t, "Submitting admin login...");
        loginDoc.getElementById('admin-form').dispatchEvent(new Event('submit'));
        try {
          iframe.contentWindow.addEventListener('error', function(e) {
            log(t, `[Iframe Error] ${e.message} at ${e.filename}:${e.lineno}:${e.colno}`, 'error');
          });
        } catch(err) {}
        await delay(3000); // Initial wait
        let retries7 = 15;
        while (retries7 > 0 && (!iframe.contentWindow.maahiDashInitialized)) {
          await delay(200);
          retries7--;
        }

        // Redirected to owner/dashboard.html
        const dashDoc = iframe.contentDocument || iframe.contentWindow.document;
        assert(t, dashDoc.title.includes("Dashboard"), "Redirected to Owner Dashboard.", `Dashboard title mismatch: ${dashDoc.title}`);

        log(t, "Waiting for dashboard stats to load...");
        let statsRetries = 15;
        let stats = [];
        let freshDashDoc = null;
        while (statsRetries > 0) {
          freshDashDoc = iframe.contentDocument || iframe.contentWindow.document;
          stats = freshDashDoc.querySelectorAll('.metric-card');
          if (stats.length >= 3) break;
          await delay(200);
          statsRetries--;
        }
        assert(t, stats.length >= 3, `Dashboard metric cards loaded successfully (Count: ${stats.length})`, "Failed to load dashboard metrics.");

        // Verify SVG chart exists (look inside the container for the dynamically injected svg)
        const chart = freshDashDoc.querySelector('#analytics-chart-container svg');
        assert(t, chart !== null, "SVG sales analytics chart rendered.", "Sales chart not found.");

        // Verify inventory table
        const inventoryRows = freshDashDoc.querySelectorAll('#inventory-tbody tr');
        assert(t, inventoryRows.length > 0, `Inventory catalog populated: ${inventoryRows.length} items found.`, "Inventory table is empty.");

        log(t, "All system features verified!");
      }
    );

    // Event listeners
    btnRunTests.addEventListener('click', () => {
      btnRunTests.disabled = true;
      resetSuite();
      runNextTest();
    });

    btnReset.addEventListener('click', () => {
      resetSuite();
    });

    // Initial setup
    updateStats();

    // Autoplay tests if requested via query parameter ?autoplay=true
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('autoplay') === 'true') {
      console.log("Autoplay parameter detected. Running tests in 1 second...");
      setTimeout(() => {
        btnRunTests.click();
      }, 1000);
    }
  </script>
</body>
